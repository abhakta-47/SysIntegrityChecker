<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proctoring Monitor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .status-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .status-info h3 {
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .status-info p {
            font-size: 16px;
            color: #333;
            font-weight: 600;
        }

        .status-indicator {
            font-size: 32px;
            min-width: 40px;
            text-align: center;
        }

        .check {
            color: #10b981;
        }

        .cross {
            color: #ef4444;
        }

        .log-container {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .log-header h2 {
            font-size: 20px;
            color: #333;
        }

        .clear-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        .clear-btn:hover {
            background: #dc2626;
        }

        .log-display {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 5px;
            height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
        }

        .log-entry {
            margin-bottom: 8px;
            padding: 5px;
            border-left: 3px solid transparent;
            padding-left: 10px;
        }

        .log-warning {
            border-left-color: #f59e0b;
            background: rgba(245, 158, 11, 0.1);
        }

        .log-error {
            border-left-color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
        }

        .log-info {
            border-left-color: #3b82f6;
            background: rgba(59, 130, 246, 0.1);
        }

        .log-success {
            border-left-color: #10b981;
            background: rgba(16, 185, 129, 0.1);
        }

        .timestamp {
            color: #9ca3af;
            margin-right: 10px;
        }

        .fullscreen-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #10b981;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
            transition: all 0.3s;
        }

        .fullscreen-btn:hover {
            background: #059669;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(16, 185, 129, 0.5);
        }

        .config-btn {
            position: fixed;
            bottom: 30px;
            left: 30px;
            background: #6366f1;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
            transition: all 0.3s;
        }

        .config-btn:hover {
            background: #4f46e5;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.5);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 15px;
            width: 90%;
            max-width: 800px;
            max-height: 80vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            padding: 20px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 22px;
        }

        .close-modal {
            background: none;
            border: none;
            color: white;
            font-size: 28px;
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background 0.3s;
        }

        .close-modal:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .modal-body {
            padding: 25px;
            overflow-y: auto;
            flex: 1;
        }

        .config-editor {
            background: #1e1e1e;
            border-radius: 8px;
            padding: 15px;
            min-height: 400px;
        }

        .config-editor textarea {
            width: 100%;
            min-height: 400px;
            background: #1e1e1e;
            color: #d4d4d4;
            border: none;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
            resize: vertical;
            outline: none;
            padding: 10px;
        }

        .modal-footer {
            padding: 20px 25px;
            background: #f9fafb;
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            border-top: 1px solid #e5e7eb;
        }

        .modal-btn {
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .modal-btn-primary {
            background: #10b981;
            color: white;
        }

        .modal-btn-primary:hover {
            background: #059669;
        }

        .modal-btn-secondary {
            background: #6b7280;
            color: white;
        }

        .modal-btn-secondary:hover {
            background: #4b5563;
        }

        .modal-btn-danger {
            background: #ef4444;
            color: white;
        }

        .modal-btn-danger:hover {
            background: #dc2626;
        }

        .error-message {
            background: #fee2e2;
            color: #991b1b;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: none;
        }

        .error-message.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔒 Proctoring Monitor System</h1>
        
        <div class="status-grid">
            <div class="status-card">
                <div class="status-info">
                    <h3>Window Focus</h3>
                    <p id="focus-status">Active</p>
                </div>
                <div class="status-indicator" id="focus-indicator">✓</div>
            </div>

            <div class="status-card">
                <div class="status-info">
                    <h3>Fullscreen</h3>
                    <p id="fullscreen-status">Not Active</p>
                </div>
                <div class="status-indicator" id="fullscreen-indicator">✗</div>
            </div>

            <div class="status-card">
                <div class="status-info">
                    <h3>Mouse Position</h3>
                    <p id="mouse-status">Inside Window</p>
                </div>
                <div class="status-indicator" id="mouse-indicator">✓</div>
            </div>

            <div class="status-card">
                <div class="status-info">
                    <h3>Tab Visibility</h3>
                    <p id="visibility-status">Visible</p>
                </div>
                <div class="status-indicator" id="visibility-indicator">✓</div>
            </div>

            <div class="status-card">
                <div class="status-info">
                    <h3>Multiple Monitors</h3>
                    <p id="monitor-status">Checking...</p>
                </div>
                <div class="status-indicator" id="monitor-indicator">-</div>
            </div>

            <div class="status-card">
                <div class="status-info">
                    <h3>Violations Count</h3>
                    <p id="violation-count">0</p>
                </div>
                <div class="status-indicator" id="violation-indicator">✓</div>
            </div>
        </div>

        <div class="log-container">
            <div class="log-header">
                <h2>Activity Log</h2>
                <button class="clear-btn" onclick="clearLogs()">Clear Logs</button>
            </div>
            <div class="log-display" id="log-display"></div>
        </div>
    </div>

    <button class="fullscreen-btn" onclick="enterFullscreen()">Enter Fullscreen</button>
    <button class="config-btn" onclick="openConfigModal()">⚙️ Edit Config</button>

    <!-- Configuration Modal -->
    <div class="modal" id="configModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>⚙️ Edit Proctoring Configuration</h2>
                <button class="close-modal" onclick="closeConfigModal()">×</button>
            </div>
            <div class="modal-body">
                <div class="error-message" id="errorMessage"></div>
                <div class="config-editor">
                    <textarea id="configTextarea" spellcheck="false"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="modal-btn modal-btn-danger" onclick="resetToDefault()">Reset to Default</button>
                <button class="modal-btn modal-btn-secondary" onclick="closeConfigModal()">Cancel</button>
                <button class="modal-btn modal-btn-primary" onclick="saveConfig()">Save & Reload</button>
            </div>
        </div>
    </div>

    <script src="proctoring.js"></script>
</body>
</html>
